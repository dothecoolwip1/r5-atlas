name: Apply legal land input limits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-land-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch testing copy only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('testing/index.html')
          text = index.read_text(encoding='utf-8')

          a = text.index('function parseJobInput(raw){')
          b = text.index('function canonical(p){', a)
          new_parser = r'''function parseJobInput(raw){
            raw=raw.trim();
            let m=raw.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
            if(m)return{type:'gps',lat:+m[1],lng:+m[2]};
            const u=raw.toUpperCase().replace(/\s+/g,' ').trim();

            m=u.match(/^(C|NE|NW|SE|SW)\s*[- ]\s*(\d{1,2})\s*[- ]\s*(\d{1,3})\s*[- ]\s*(\d{1,2})\s*(?:[- ]\s*)?W?\s*([1-6])\s*M?$/);
            if(m){
              const p={type:'quarter',quarter:m[1],sec:+m[2],twp:+m[3],rge:+m[4],mer:+m[5]};
              if(p.sec>=1&&p.sec<=36&&p.twp>=1&&p.twp<=126&&p.rge>=1&&p.rge<=34)return p;
              return{type:'invalid'};
            }

            m=u.match(/^(\d{1,2})\s*[- ]\s*(\d{1,2})\s*[- ]\s*(\d{1,3})\s*[- ]\s*(\d{1,2})\s*(?:[- ]\s*)?W?\s*([1-6])\s*M?$/);
            if(m){
              const p={type:'ats',lsd:+m[1],sec:+m[2],twp:+m[3],rge:+m[4],mer:+m[5]};
              if(p.lsd>=1&&p.lsd<=16&&p.sec>=1&&p.sec<=36&&p.twp>=1&&p.twp<=126&&p.rge>=1&&p.rge<=34)return p;
              return{type:'invalid'};
            }
            return{type:'invalid'}
          }
          '''
          text = text[:a] + new_parser + text[b:]

          a = text.index('async function lookupQuarter(p){')
          b = text.index('async function identifyPoint(lat,lng){', a)
          new_quarter = r'''async function lookupQuarter(p){
            let path='/3/query';
            let where=`QS='${p.quarter}' AND SEC=${p.sec} AND TWP=${p.twp} AND RGE=${p.rge} AND M=${p.mer}`;
            if(p.quarter==='C'){
              path='/1/query';
              where=`SEC=${p.sec} AND TWP=${p.twp} AND RGE=${p.rge} AND M=${p.mer} AND RA=' '`;
            }
            const d=await fetchJson(atsUrl(path,{f:'json',where,returnGeometry:'true',outSR:'4326',outFields:'*'}));
            const f=d.features?.[0];
            if(!f)throw Error('Quarter or section centre not found.');
            const c=polygonCenter(f.geometry);
            return{...c,ats:canonicalQ(p),geometry:f.geometry,quarter:p.quarter}
          }
          '''
          text = text[:a] + new_quarter + text[b:]
          index.write_text(text, encoding='utf-8')

          converter = Path('testing/lsd-converter.js')
          js = converter.read_text(encoding='utf-8')
          replacements = [
            ("['Range', range, 1, 30]", "['Range', range, 1, 34]"),
            ("if (![4, 5, 6].includes(meridian)) return fail('invalid_input', 'This Alberta converter supports W4, W5, and W6.');", "if (![1, 2, 3, 4, 5, 6].includes(meridian)) return fail('invalid_input', 'Meridian must be between 1 and 6.');"),
            ("!/^[456]\\d{9}$/.test(input.trim())", "!/^[1-6]\\d{9}$/.test(input.trim())"),
          ]
          for old,new in replacements:
            if old not in js: raise SystemExit('Expected converter text missing: '+old)
            js = js.replace(old,new,1)

          old = "const key = (((m - 4) * 30 + r - 1) * 126 + t - 1) * 36 + s - 1;\n    const index = find(key);\n    const missing = () => ({ ...parsed, status: 'missing_record', message: 'No matching Alberta ATS record exists for this LSD. Check the range and meridian.' });"
          new = "const missing = () => ({ ...parsed, status: 'missing_record', message: 'No matching Alberta ATS record exists for this LSD. Check the range and meridian.' });\n    if (m < 4 || m > 6 || r > 30) return missing();\n    const key = (((m - 4) * 30 + r - 1) * 126 + t - 1) * 36 + s - 1;\n    const index = find(key);"
          if old not in js: raise SystemExit('Expected resolve block missing')
          js = js.replace(old,new,1)
          converter.write_text(js, encoding='utf-8')
          PY

      - name: Verify requested limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('testing/index.html').read_text(encoding='utf-8')
          j=Path('testing/lsd-converter.js').read_text(encoding='utf-8')
          checks=[
            "(C|NE|NW|SE|SW)",
            "p.sec>=1&&p.sec<=36",
            "p.twp>=1&&p.twp<=126",
            "p.rge>=1&&p.rge<=34",
            "p.lsd>=1&&p.lsd<=16",
            "([1-6])",
            "p.quarter==='C'",
          ]
          for c in checks:
            if c not in t: raise SystemExit('Missing parser check: '+c)
          if "['Range', range, 1, 34]" not in j: raise SystemExit('Converter range limit not updated')
          if "[1, 2, 3, 4, 5, 6].includes(meridian)" not in j: raise SystemExit('Converter meridian limit not updated')
          if "if (m < 4 || m > 6 || r > 30) return missing();" not in j: raise SystemExit('Safe Alberta pack guard missing')
          PY

      - name: Verify production tracker unchanged
        shell: bash
        run: |
          git diff --exit-code HEAD -- index.html assets

      - name: Commit testing changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/inspect-land-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/index.html testing/lsd-converter.js .github/workflows/inspect-land-fields.yml
          git commit -m 'Update legal land input limits in testing copy'
          git push origin HEAD:main
