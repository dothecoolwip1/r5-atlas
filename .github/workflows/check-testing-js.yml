name: Check Testing Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-testing-js.yml'
      - 'testing/**'
      - 'app/**'
  pull_request:
    paths:
      - 'testing/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find testing/js -type f -name '*.js' -print -exec node --check {} \;
          node --check testing/data/facilities.js
          node --check testing/app-update.js
          node --check testing/sw.js
      - name: Enforce testing architecture through Pack 4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('testing/index.html').read_text(encoding='utf-8')
          app=Path('testing/js/app.js').read_text(encoding='utf-8')
          if re.search(r'<style\b', html, re.I):
              raise SystemExit('testing/index.html still contains inline CSS')
          inline=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          if inline:
              raise SystemExit(f'testing/index.html still contains {len(inline)} inline scripts')
          names=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',app)
          dup=sorted({n for n in names if names.count(n)>1})
          if dup:
              raise SystemExit('Duplicate function declarations remain: '+', '.join(dup))
          pack2=Path('testing/js/features/saved-locations.js').read_text(encoding='utf-8')
          device=Path('testing/js/core/device-store.js').read_text(encoding='utf-8')
          pack3=Path('testing/js/features/universal-search.js').read_text(encoding='utf-8')
          pack4=Path('testing/js/features/field-ui.js').read_text(encoding='utf-8')
          css=Path('testing/styles/app.css').read_text(encoding='utf-8')
          text='\n'.join([html,app,pack2,device,pack3,pack4,css,Path('testing/app-update.js').read_text(encoding='utf-8')])
          forbidden=['raw.githubusercontent.com/dothecoolwip1/r5-atlas/71cbae','Coming soon']
          for token in forbidden:
              if token in text:
                  raise SystemExit('Forbidden legacy runtime token remains: '+token)
          if 'prompt(' in app:
              raise SystemExit('Native prompt() remains in the app runtime')
          if 'confirm(' in app:
              raise SystemExit('Native confirm() remains in the app runtime')
          required=[
              'testing/data/alberta-ats-v41-lsd.bin.gz',
              'testing/data/alberta-ats-v41-lsd.manifest.json',
              'testing/js/lsd-converter.bundle.js',
              'testing/js/core/storage.js',
              'testing/js/core/device-store.js',
              'testing/js/core/providers.js',
              'testing/js/features/saved-locations.js',
              'testing/js/features/universal-search.js',
              'testing/js/features/field-ui.js',
          ]
          for p in required:
              if not Path(p).exists():
                  raise SystemExit('Required Pack 1 file missing: '+p)
          pack2_tokens={
              'IndexedDB device database':'indexedDB.open',
              'canonical saved location store':"SAVED_STORE='savedLocations'",
              'visit tracking':'visitCount',
              'favourites':'favorite',
              'nearby alerts':'R5NearbyAlerts',
              'Saved LSD search':'id="savedSearch"',
              'Saved LSD sorting':'id="savedSort"',
              'nearby radius':'id="nearbyRadius"',
              'Pack 4 version':'content="0.10.8"',
          }
          combined='\n'.join([html,pack2,device])
          for label,token in pack2_tokens.items():
              if token not in combined:
                  raise SystemExit(f'Pack 2 check failed, missing {label}: {token}')
          pack3_tokens={
              'universal search input':'aria-label="Universal field search"',
              'search suggestions':'id="universalSearchResults"',
              'clear universal search':'id="clearUniversalSearch"',
              'connectivity status':'id="connectionStatus"',
              'data source status':'id="dataSourceStatus"',
              'GPS status':'id="gpsStatus"',
              'PID recognition':'parsePid',
              'online AER universal search':'searchAerOnline',
              'offline ST37 universal search':'searchSt37Offline',
              'truthful ST37 cache state':'st37Cached',
              'uncached offline data state':'DEVICE DATA',
              'preserve saved well selection':'targetLicence',
              'canonical IndexedDB saved entity search':'savedDeviceEntitySuggestions',
              'UWI normalization':'compactSearchToken',
              'recent searches':'r5-atlas-universal-search-recent-v1',
              'favourite suggestions':'favorite',
              'field navigation state':'navWellsState',
              'location record tags':'tags:',
              'location record hazards':'hazards:',
              'offline availability':'offlineAvailable',
          }
          combined3='\n'.join([html,app,pack2,pack3])
          for label,token in pack3_tokens.items():
              if token not in combined3:
                  raise SystemExit(f'Pack 3 check failed, missing {label}: {token}')
          pack4_tokens={
              'Field Mode toggle':'id="fieldModeToggle"',
              'persistent Field Mode':'r5-atlas-field-mode-v1',
              'desktop workspace':'desktop-workspace',
              'tablet landscape layout':'tablet-landscape',
              'desktop three panel grid':'grid-template-columns:minmax(300px,340px)',
              'marker clustering':'markerClusterGroup',
              'facility cluster':'facilityClusterLayer',
              'well cluster':'wellClusterLayer',
              'semantic LSD marker':'r5-marker-lsd',
              'semantic well marker':'r5-marker-well',
              'semantic disposal marker':'r5-marker-disposal',
              'non colour filter state':'data-state-label',
              'minimum touch target':'--r5-control-min:44px',
              'focus visible':'focus-visible',
              'reduced motion':'prefers-reduced-motion',
              'map marker accessibility':'keyboard:true',
              'Android Back sheet history':'r5AtlasSheet',
              'mobile sheet push state':'history.pushState',
              'compact Wells radius grid':'grid-template-columns:repeat(3,minmax(0,1fr))',
          }
          combined4='\n'.join([html,app,pack4,css])
          for label,token in pack4_tokens.items():
              if token not in combined4:
                  raise SystemExit(f'Pack 4 check failed, missing {label}: {token}')
          sw=Path('testing/sw.js').read_text(encoding='utf-8')
          for asset in ['./js/core/device-store.js','./js/features/saved-locations.js','./js/features/universal-search.js','./js/features/field-ui.js','./data/st37-meta.json']:
              if asset not in sw:
                  raise SystemExit('Offline runtime is not precached: '+asset)
          for external in ['leaflet.markercluster@1.5.3/dist/MarkerCluster.css','leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js']:
              if external not in sw or external not in html:
                  raise SystemExit('Pack 4 cluster dependency is not available online and offline: '+external)
          print('Pack 1 through Pack 4 architecture checks passed')
          PY
      - name: Check React and TypeScript migration workspace
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run check
