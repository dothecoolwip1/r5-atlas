name: Check Testing Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-testing-js.yml'
      - 'testing/**'
      - 'app/**'
  pull_request:
    paths:
      - 'testing/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find testing/js -type f -name '*.js' -print -exec node --check {} \;
          node --check testing/data/facilities.js
          node --check testing/app-update.js
          node --check testing/sw.js
      - name: Enforce Pack 1 architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('testing/index.html').read_text(encoding='utf-8')
          app=Path('testing/js/app.js').read_text(encoding='utf-8')
          if re.search(r'<style\b', html, re.I):
              raise SystemExit('testing/index.html still contains inline CSS')
          inline=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          if inline:
              raise SystemExit(f'testing/index.html still contains {len(inline)} inline scripts')
          names=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',app)
          dup=sorted({n for n in names if names.count(n)>1})
          if dup:
              raise SystemExit('Duplicate function declarations remain: '+', '.join(dup))
          text='\n'.join([html,app,Path('testing/app-update.js').read_text(encoding='utf-8')])
          forbidden=['raw.githubusercontent.com/dothecoolwip1/r5-atlas/71cbae','Coming soon']
          for token in forbidden:
              if token in text:
                  raise SystemExit('Forbidden legacy runtime token remains: '+token)
          if 'prompt(' in app:
              raise SystemExit('Native prompt() remains in the app runtime')
          if 'confirm(' in app:
              raise SystemExit('Native confirm() remains in the app runtime')
          required=[
              'testing/data/alberta-ats-v41-lsd.bin.gz',
              'testing/data/alberta-ats-v41-lsd.manifest.json',
              'testing/js/lsd-converter.bundle.js',
              'testing/js/core/storage.js',
              'testing/js/core/providers.js',
          ]
          for p in required:
              if not Path(p).exists():
                  raise SystemExit('Required Pack 1 file missing: '+p)
          print('Pack 1 static architecture checks passed')
          PY
      - name: Check React and TypeScript migration workspace
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run check
