name: R5 Atlas v0.3.0 settings update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r5-v0.3.0-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply v0.3.0 patch
        run: python tools/r5_v030_patch.py

      - name: Validate v0.3.0
        shell: bash
        run: |
          node --check testing/app-update.js
          python -m json.tool testing/version.json >/dev/null
          grep -Fq 'App v0.3.0' testing/index.html
          grep -Fq 'name="r5-app-version" content="0.3.0"' testing/index.html
          grep -Fq "id = 'r5-settings-gear'" testing/app-update.js
          grep -Fq 'Offline data' testing/app-update.js
          grep -Fq 'Diagnostics' testing/app-update.js
          ! grep -Fq "appButton = document.createElement('button')" testing/app-update.js
          git diff --exit-code HEAD -- index.html assets

      - name: Commit v0.3.0
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/app-update.js testing/index.html testing/version.json
          git commit -m 'Move settings to header and restore History v0.3.0'
          git push origin HEAD:main
