name: Inspect LandTracker public download transport

on:
  push:
    branches: [landtracker-html-build]
    paths:
      - '.github/workflows/uptodown-landtracker-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decompile current Uptodown API client
        shell: bash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" \
            'https://d.apkpure.net/b/APK/com.uptodown?version=latest' -o /tmp/uptodown.apk
          curl -L --fail --retry 3 \
            'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip' -o /tmp/jadx.zip
          mkdir -p /tmp/jadx /tmp/src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx -j 4 --show-bad-code -d /tmp/src /tmp/uptodown.apk >/tmp/jadx.log 2>&1 || true
          echo '--- files containing API headers ---'
          grep -RIl 'Identificador-Version\|Uptodown_Android\|APIKEY' /tmp/src/sources | head -50
          echo '--- source context ---'
          grep -RIn -C 25 'Identificador-Version\|Uptodown_Android\|APIKEY' /tmp/src/sources | head -900 || true
          echo '--- base API / auth context ---'
          grep -RIn -C 20 'byPackagename\|auth/token\|Hashing.sha256\|sha256Base' /tmp/src/sources | head -700 || true
