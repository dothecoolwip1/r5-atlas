name: Inspect LandTracker public download transport

on:
  push:
    branches: [landtracker-html-build]
    paths:
      - '.github/workflows/uptodown-landtracker-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Uptodown API client version
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import hashlib, time
          secret='$(=a%·!45J&S'
          hour=int(time.time()//3600*3600)
          key=hashlib.sha256((secret+str(hour)).encode()).hexdigest()
          open('/tmp/key','w').write(key)
          PY
          KEY=$(cat /tmp/key)
          UA='Dalvik/2.1.0 (Linux; U; Android 14; SM-G955F Build/AP2A.240805.005)'
          URL='https://www.uptodown.app/eapi/apps/byPackagename/com.Rocanda.LandTrackerPro'
          for V in 738 737 736 735 734 733 732 731 730; do
            echo "=== version $V ==="
            curl -sS -D /tmp/h -o /tmp/b --max-time 30 -A "$UA" \
              -H 'Identificador: Uptodown_Android' -H "Identificador-Version: $V" -H "APIKEY: $KEY" "$URL" || true
            head -1 /tmp/h 2>/dev/null || true
            head -c 300 /tmp/b 2>/dev/null || true
            echo
          done
