name: Inspect LandTracker public download transport

on:
  push:
    branches: [landtracker-html-build]
    paths:
      - '.github/workflows/uptodown-landtracker-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Uptodown client and inspect API constants
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 -A 'Mozilla/5.0' \
            'https://www.apkba.com/uptodown-app-store/com.uptodown/download' -o /tmp/uptodown.apk
          wc -c /tmp/uptodown.apk
          sha256sum /tmp/uptodown.apk
          file /tmp/uptodown.apk
          unzip -t /tmp/uptodown.apk | tail -3
          echo '--- relevant strings ---'
          for f in $(unzip -Z1 /tmp/uptodown.apk | grep -E '^classes.*\.dex$'); do
            unzip -p /tmp/uptodown.apk "$f" | strings | grep -E -C 4 'Uptodown_Android|Identificador-Version|APIKEY|\$\(=a%|apikey' || true
          done
