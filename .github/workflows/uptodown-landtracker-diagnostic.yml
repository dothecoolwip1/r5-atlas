name: Inspect LandTracker public download transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uptodown-landtracker-diagnostic.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture public download JavaScript
        shell: bash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -A "$UA" -L --fail --retry 2 --connect-timeout 10 --max-time 30 \
            'https://stc.utdstc.com/1789457684850/download.js' -o tools/uptodown-download.js
          wc -c tools/uptodown-download.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/uptodown-download.js
          git commit -m 'Capture Uptodown download transport JavaScript'
          git push origin HEAD:main
