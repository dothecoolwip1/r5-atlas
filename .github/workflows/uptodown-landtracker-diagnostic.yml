name: Inspect LandTracker public download transport

on:
  push:
    branches: [landtracker-html-build]
    paths:
      - '.github/workflows/uptodown-landtracker-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Uptodown client and inspect API constants
        shell: bash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" \
            'https://d.apkpure.net/b/APK/com.uptodown?version=latest' -o /tmp/uptodown.apk
          wc -c /tmp/uptodown.apk
          sha256sum /tmp/uptodown.apk
          file /tmp/uptodown.apk
          unzip -t /tmp/uptodown.apk | tail -3
          mkdir -p /tmp/dex
          unzip -j /tmp/uptodown.apk 'classes*.dex' -d /tmp/dex >/dev/null
          echo '--- relevant strings ---'
          for f in /tmp/dex/classes*.dex; do
            echo "### $f"
            strings -a -n 5 "$f" | grep -E -C 8 'Uptodown_Android|Identificador-Version|APIKEY|apikey|API_KEY|eapi/apps/byPackagename|downloadUrl|download-url|/eapi/' || true
          done
          echo '--- likely secrets / header constants ---'
          for f in /tmp/dex/classes*.dex; do
            strings -a -n 8 "$f" | grep -E '\$\(=a%|Identificador|Uptodown_Android|APIKEY|apikey|sha256|SHA-256' | head -300 || true
          done
