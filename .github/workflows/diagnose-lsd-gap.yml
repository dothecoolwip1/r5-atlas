name: Clarify invalid LSD message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lsd-gap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change converter message only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('testing/lsd-converter.js')
          s=p.read_text(encoding='utf-8')
          old='This LSD has no location in the bundled Alberta grid. No coordinate was estimated.'
          new='No matching Alberta ATS record exists for this LSD. Check the range and meridian.'
          if s.count(old) != 1:
            raise SystemExit('Expected converter message not found exactly once')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit converter-only app change and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/diagnose-lsd-gap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/lsd-converter.js .github/workflows/diagnose-lsd-gap.yml
          git commit -m 'Clarify nonexistent Alberta ATS LSD message'
          git push origin HEAD:main
