name: Diagnose LSD data gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lsd-gap.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Alberta ATS services
        shell: bash
        run: |
          python - <<'PY'
          import collections, json, urllib.parse, urllib.request
          base='https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query'
          def query(where, out='OBJECTID,M,RGE,TWP,SEC,LS,QS,RA,DESCRIPTOR', count=1000):
            q=urllib.parse.urlencode({'f':'json','where':where,'outFields':out,'returnGeometry':'false','resultRecordCount':count,'orderByFields':'SEC,LS'})
            with urllib.request.urlopen(base+'?'+q, timeout=60) as r:return json.load(r)
          for rge in (28,29,30):
            d=query(f'M=4 AND RGE={rge} AND TWP=39')
            feats=d.get('features',[])
            secs=collections.defaultdict(list)
            for f in feats:
              a=f['attributes']; secs[a['SEC']].append(a['LS'])
            print('\n### RANGE',rge,'TWP39')
            print('records',len(feats))
            print('sections',sorted(secs))
            print('section_count',len(secs))
            for s in sorted(secs):
              print('SEC',s,'LSDs',sorted(secs[s]))
          for sec in (1,2,3,4,5,6,31,32,33,34,35,36):
            d=query(f'M=4 AND RGE=29 AND TWP=39 AND SEC={sec}')
            feats=d.get('features',[])
            print('\nR29 SEC',sec,'count',len(feats))
            for f in feats[:20]: print(json.dumps(f['attributes'],sort_keys=True))
          PY
