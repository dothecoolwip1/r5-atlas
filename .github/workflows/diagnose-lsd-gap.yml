name: Diagnose LSD data gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lsd-gap.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Alberta ATS services
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          tests = [
            ('ags-target-all', 'https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query', "M=4 AND RGE=29 AND TWP=39 AND SEC=36 AND LS=10"),
            ('ags-target-space', 'https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query', "M=4 AND RGE=29 AND TWP=39 AND SEC=36 AND LS=10 AND RA=' '"),
            ('ags-target-section', 'https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query', "M=4 AND RGE=29 AND TWP=39 AND SEC=36"),
            ('ags-control', 'https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query', "M=4 AND RGE=28 AND TWP=39 AND SEC=36 AND LS=10"),
            ('base-target-all', 'https://geospatial.alberta.ca/titan/rest/services/base/alberta_township_system/MapServer/5/query', "M=4 AND RGE=29 AND TWP=39 AND SEC=36 AND LS=10"),
          ]
          for name, base, where in tests:
            q = urllib.parse.urlencode({'f':'json','where':where,'outFields':'OBJECTID,M,RGE,TWP,SEC,LS,QS,RA,DESCRIPTOR','returnGeometry':'false','resultRecordCount':100})
            url = base + '?' + q
            with urllib.request.urlopen(url, timeout=60) as r:
              d = json.load(r)
            print('\n###', name)
            if 'error' in d:
              print(json.dumps(d['error'], indent=2))
              continue
            feats = d.get('features', [])
            print('count', len(feats))
            for f in feats[:25]:
              print(json.dumps(f.get('attributes',{}), sort_keys=True))
          PY
