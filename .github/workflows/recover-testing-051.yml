name: Recover Testing v0.5.1

on:
  push:
    paths:
      - '.github/workflows/recover-testing-051.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known working testing shell
        run: |
          git checkout 828af39c5389c710b3e966a3b795ce312cd72266 -- testing/index.html testing/sw.js testing/version.json
      - name: Bump recovery version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('testing/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('content="0.4.0"', 'content="0.5.1"', 1)
          text = text.replace('App v0.4.0', 'App v0.5.1', 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('testing/sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const CACHE_NAME = `r5-atlas-${APP_VERSION}`;", "const CACHE_NAME = `r5-atlas-${APP_VERSION}-recovery`;", 1)
          sw.write_text(sw_text, encoding='utf-8')

          release = {
            'version': '0.5.1',
            'releasedAt': '2026-09-17',
            'title': 'Testing startup recovery',
            'notes': [
              'Restored the last known working R5 Atlas testing shell after the v0.5.0 hybrid integration caused startup problems on the web app and installed PWA.',
              'Kept the Alberta Converter v2 offline lookup, history, maps, install support, settings, and managed update system from the working v0.4.0 build.',
              'Hybrid live fallback changes are temporarily isolated from the testing shell until they pass full browser and installed app validation.'
            ]
          }
          Path('testing/version.json').write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          check = index.read_text(encoding='utf-8')
          assert 'content="0.5.1"' in check
          assert 'App v0.5.1' in check
          print('Recovery shell prepared')
          PY
      - name: Check primary application JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('testing/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>', html, re.S | re.I)
          executable = []
          for attrs, body in blocks:
              type_match = re.search(r'type=["\']([^"\']+)', attrs, re.I)
              script_type = type_match.group(1).lower() if type_match else 'text/javascript'
              if script_type in ('text/javascript', 'application/javascript', 'module') and not body.lstrip().startswith('H4sI'):
                  executable.append(body)
          for i, body in enumerate(executable):
              Path(f'/tmp/app-{i}.js').write_text(body, encoding='utf-8')
          print('Executable inline scripts:', len(executable))
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
      - name: Commit recovery build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing/index.html testing/sw.js testing/version.json
          git commit -m "Recover testing startup v0.5.1"
          git push origin HEAD:main
