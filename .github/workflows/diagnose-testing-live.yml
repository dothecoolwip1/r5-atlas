name: Diagnose Testing Live

on:
  push:
    paths:
      - '.github/workflows/diagnose-testing-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live browser diagnostic
        run: |
          cat > diagnose.mjs <<'JS'
          import { chromium } from 'playwright';

          async function inspect(serviceWorkers, label) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              serviceWorkers,
              viewport: { width: 390, height: 844 }
            });
            const page = await context.newPage();
            const errors = [];
            const failed = [];
            page.on('console', m => console.log(label, 'CONSOLE', m.type(), m.text()));
            page.on('pageerror', e => {
              errors.push(String(e));
              console.log(label, 'PAGEERROR', String(e));
            });
            page.on('requestfailed', r => {
              failed.push([r.url(), r.failure()?.errorText]);
              console.log(label, 'REQUESTFAILED', r.url(), r.failure()?.errorText);
            });
            const url = 'https://dothecoolwip1.github.io/r5-atlas/testing/?diag=' + Date.now() + '&mode=' + label;
            let response = null;
            try {
              response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
              console.log(label, 'STATUS', response?.status());
              console.log(label, 'TITLE', await page.title());
              await page.waitForTimeout(12000);
              console.log(label, 'BODY_TEXT', (await page.locator('body').innerText()).slice(0, 5000));
              console.log(label, 'HTML_LENGTH', (await page.content()).length);
              console.log(label, 'BODY_CHILDREN', await page.locator('body').evaluate(el => el.children.length));
              console.log(label, 'META_VERSION', await page.locator('meta[name="r5-app-version"]').getAttribute('content').catch(() => null));
              console.log(label, 'READY_STATE', await page.evaluate(() => document.readyState));
              console.log(label, 'SW_CONTROLLER', await page.evaluate(() => !!navigator.serviceWorker?.controller));
              console.log(label, 'LOADING_TEXT_MATCHES', await page.locator('text=/loading/i').count().catch(() => -1));
              await page.screenshot({ path: `testing-live-${label}.png`, fullPage: true });
            } catch (e) {
              errors.push(String(e));
              console.log(label, 'NAVIGATION_ERROR', String(e));
            }
            await browser.close();
            return { errors, failed, status: response?.status() || null };
          }

          const noSw = await inspect('block', 'no-sw');
          const withSw = await inspect('allow', 'with-sw');
          console.log('SUMMARY', JSON.stringify({ noSw, withSw }));
          if (noSw.errors.length || withSw.errors.length || noSw.status !== 200 || withSw.status !== 200) process.exitCode = 2;
          JS
          node diagnose.mjs
