name: Apply Hybrid LSD Testing

on:
  push:
    paths:
      - '.github/workflows/apply-hybrid-testing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hybrid patch
        run: python tools/apply_hybrid_testing.py
      - name: Syntax check hybrid browser code
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('testing/index.html').read_text(encoding='utf-8')
          start = text.index('const R5_HYBRID_CACHE_KEY')
          end = text.index('function geometryLatLng', start)
          Path('/tmp/r5-hybrid.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/r5-hybrid.js
      - name: Smoke test live Alberta ATS
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = 'https://geospatial.alberta.ca/titan/rest/services/ags_apps/ags_apps_alberta_township_system/MapServer/3/query'

          def query(where):
              qs = urllib.parse.urlencode({
                  'f': 'json',
                  'where': where,
                  'outFields': 'LS,SEC,TWP,RGE,M,RA',
                  'returnGeometry': 'true',
                  'outSR': '4326',
              })
              with urllib.request.urlopen(base + '?' + qs, timeout=30) as response:
                  return json.load(response)

          def land_feature(data):
              features = data.get('features', [])
              return next((f for f in features if not str(f.get('attributes', {}).get('RA', '')).strip()), features[0] if features else None)

          def centroid(geometry):
              area2 = cx = cy = 0.0
              for ring in geometry.get('rings', []):
                  for i in range(len(ring)):
                      x0, y0 = ring[i - 1]
                      x1, y1 = ring[i]
                      cross = x0 * y1 - x1 * y0
                      area2 += cross
                      cx += (x0 + x1) * cross
                      cy += (y0 + y1) * cross
              if abs(area2) < 1e-14:
                  return None
              return cy / (3 * area2), cx / (3 * area2)

          known = query('LS=6 AND SEC=32 AND TWP=48 AND RGE=7 AND M=5')
          if not known.get('features'):
              raise SystemExit('Known Alberta ATS LSD smoke test returned no feature')

          target = query('LS=10 AND SEC=36 AND TWP=39 AND RGE=29 AND M=4')
          print('Known live features:', len(known.get('features', [])))
          print('R29 live features:', len(target.get('features', [])))
          feature = land_feature(target)
          if feature and feature.get('geometry'):
              print('R29 live centroid:', centroid(feature['geometry']))
          PY
      - name: Commit testing v0.5.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testing/index.html testing/sw.js testing/version.json
          if git diff --cached --quiet; then
            echo "No testing changes to commit"
          else
            git commit -m "Add hybrid LSD lookup to testing v0.5.0"
            git push origin HEAD:main
          fi
