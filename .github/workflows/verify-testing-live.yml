name: Verify Testing Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-testing-live.yml'
      - 'testing/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Verify deployed mobile PWA online and offline
        shell: bash
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';

          const base='https://dothecoolwip1.github.io/r5-atlas/testing/';
          const expected='0.10.8';
          const pid='5070483206';
          const canonical='06-32-048-07 W5M';
          const legacyKey='albertaOilfieldFieldMapHistoryV15';
          const legacyNotesKey='albertaOilfieldFieldMapNotesV17';
          const savedCompany='Pack 3 Test Energy';
          const savedUwi='00/06-32-048-07W5/0';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function waitForDeployment(){
            const deadline=Date.now()+240000;
            let last='';
            while(Date.now()<deadline){
              try{
                const r=await fetch(base+'version.json?t='+Date.now(),{cache:'no-store'});
                if(r.ok){
                  const j=await r.json();
                  last=j.version||'';
                  if(last===expected)return;
                }
              }catch{}
              await sleep(5000);
            }
            throw new Error('Timed out waiting for deployed v'+expected+'. Last version: '+last);
          }

          function assert(condition,message){
            if(!condition)throw new Error(message);
          }

          await waitForDeployment();

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(({expected,legacyKey,legacyNotesKey,canonical,savedCompany,savedUwi})=>{
            localStorage.setItem('r5-atlas-auto-updates','no');
            localStorage.setItem('r5-atlas-last-build',expected);
            localStorage.setItem('r5-atlas-nearby-alerts-v1','no');
            localStorage.setItem('r5-atlas-nearby-radius-km-v1','0.5');
            const now='2026-09-19T12:00:00.000Z';
            localStorage.setItem(legacyKey,JSON.stringify([{
              id:7001,
              ats:canonical,
              notes:'',
              created:now,
              firstSearched:now,
              lastSearched:now,
              searchCount:1,
              favorite:true,
              selectedDisposal:null,
              surfaceDls:'06-32-048-07W5',
              licensee:savedCompany,
              uwi:savedUwi,
              licence:'P3TEST',
              wellLat:53.18331,
              wellLng:-114.991884
            }]));
            localStorage.setItem(legacyNotesKey,JSON.stringify({
              [canonical.replace(/\s+/g,'').toUpperCase()]:'Legacy Pack 3 favourite note'
            }));
          },{expected,legacyKey,legacyNotesKey,canonical,savedCompany,savedUwi});

          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));

          await page.goto(base+'?pack4='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForSelector('#jobInput',{state:'visible',timeout:30000});
          await page.waitForFunction(v=>document.querySelector('meta[name="r5-app-version"]')?.content===v,expected);
          await page.waitForFunction(()=>globalThis.R5Pack2Ready && globalThis.R5UniversalSearch && globalThis.R5DeviceStore && globalThis.R5MapUI && globalThis.R5FieldUI);
          await page.evaluate(()=>globalThis.R5Pack2Ready);

          assert(await page.locator('meta[name="r5-app-version"]').getAttribute('content')===expected,'Version meta is not v'+expected);
          await page.waitForSelector('#r5-settings-gear',{state:'visible',timeout:10000});
          const mobileUi=await page.evaluate(()=>{
            const search=document.querySelector('.map-search').getBoundingClientRect();
            const dock=document.getElementById('facilityCategoryFilters').getBoundingClientRect();
            const filterTops=[...document.querySelectorAll('#facilityCategoryFilters .filter-chip')].map(x=>x.getBoundingClientRect().top);
            const mapBox=document.getElementById('mapSection').getBoundingClientRect();
            const nav=document.querySelector('.mobile-nav').getBoundingClientRect();
            const gear=document.getElementById('r5-settings-gear').getBoundingClientRect();
            return{
              dataPill:getComputedStyle(document.querySelector('.data-pill')).display,
              fieldToggle:getComputedStyle(document.getElementById('fieldModeToggle')).display,
              gearParent:document.getElementById('r5-settings-gear').parentElement?.className||'',
              gearWidth:gear.width,gearHeight:gear.height,gearRight:gear.right,viewportWidth:innerWidth,
              searchHeight:search.height,searchBottom:search.bottom,
              dockTop:dock.top,dockHeight:dock.height,dockWidth:dock.width,
              filterTopSpread:Math.max(...filterTops)-Math.min(...filterTops),
              mapHeight:mapBox.height,mapBottom:mapBox.bottom,navTop:nav.top,
              clearJobDisplay:getComputedStyle(document.getElementById('clearJob')).display,
              defaultStatusDisplay:getComputedStyle(document.getElementById('jobStatus')).display,
            };
          });
          assert(mobileUi.dataPill==='none','Mobile header still shows the long version/data pill');
          assert(mobileUi.fieldToggle==='none','Mobile header still shows the Field Mode button');
          assert(mobileUi.gearParent.includes('topbar-actions'),'Settings gear is not mounted in the topbar actions');
          assert(mobileUi.gearWidth>=44 && mobileUi.gearHeight>=44,'Settings gear is below the 44 px touch target');
          assert(mobileUi.gearRight>=mobileUi.viewportWidth-60,'Settings gear is not aligned to the right side of the phone header');
          assert(mobileUi.searchHeight<90,'Mobile search surface is still oversized');
          assert(mobileUi.dockHeight<=46 && mobileUi.dockWidth>300 && mobileUi.filterTopSpread<3,'Disposal filters are not one compact horizontal row');
          assert(mobileUi.dockTop>=mobileUi.searchBottom+4,'Disposal filters are above or overlapping the mobile search surface');
          assert(mobileUi.mapHeight>700 && Math.abs(mobileUi.mapBottom-mobileUi.navTop)<=8,'Map does not fill the phone viewport down to navigation');
          assert(mobileUi.clearJobDisplay==='none','Clear Job is visible before a job exists');
          assert(mobileUi.defaultStatusDisplay==='none','Default instructional status still inflates the mobile search card');
          assert((await page.locator('#connectionStatus').innerText()).includes('ONLINE'),'Connectivity strip does not show ONLINE');
          assert((await page.locator('#dataSourceStatus').innerText()).includes('AER LIVE'),'Online data status does not show AER LIVE');
          assert((await page.locator('#gpsStatus').innerText()).includes('GPS'),'GPS status chip is missing');
          assert(await page.locator('#universalSearchResults').isHidden(),'Universal suggestions opened before the field was focused');

          await page.locator('#jobInput').focus();
          await page.waitForSelector('#universalSearchResults:not(.hidden)');
          assert((await page.locator('#universalSearchResults').innerText()).includes('Favourite'),'Favourite saved LSD is not suggested on focus');

          await page.locator('#jobInput').fill(pid);
          await page.waitForTimeout(350);
          assert((await page.locator('#universalSearchResults').innerText()).includes('PID'),'PID was not recognized in universal suggestions');
          assert(!(await page.locator('#clearUniversalSearch').isHidden()),'Clear-search control did not appear');
          await page.locator('#findJob').click();
          await page.waitForFunction(()=>document.querySelector('#jobStatus')?.textContent?.includes('Job loaded:'),null,{timeout:60000});
          await page.waitForFunction(()=>getComputedStyle(document.getElementById('clearJob')).display!=='none');
          assert((await page.locator('#jobDetails').innerText()).includes(canonical),'PID did not resolve to the expected LSD');
          assert(!(await page.locator('#clearJob').isHidden()),'Clear Job did not appear after an active job was loaded');

          assert(!(await page.locator('#navLsdState').isHidden()),'LSD navigation state did not activate');
          assert(!(await page.locator('#navWellsState').isHidden()),'Wells navigation state did not activate');
          assert(!(await page.locator('#navSavedState').isHidden()),'Saved navigation state did not activate');

          await page.locator('.mobile-nav button[data-scroll="wellsPanel"]').click();
          await page.waitForSelector('#wellsPanel.mobile-open');
          const wellsMobileLayout=await page.evaluate(()=>{
            const sheet=document.getElementById('wellsPanel').getBoundingClientRect();
            const toolbar=document.querySelector('#wellsPanel .well-toolbar').getBoundingClientRect();
            const chips=[...document.querySelectorAll('#wellsPanel .v21-radius-row .well-radius')].map(el=>el.getBoundingClientRect());
            const uniqueRows=[...new Set(chips.map(r=>Math.round(r.top)))];
            const firstCard=document.querySelector('#wellsPanel .well-card')?.getBoundingClientRect()||null;
            return{
              sheetTop:sheet.top,
              toolbarHeight:toolbar.height,
              uniqueRows:uniqueRows.length,
              firstRowCount:chips.filter(r=>Math.abs(r.top-chips[0].top)<3).length,
              chipWidths:chips.map(r=>r.width),
              firstCardTop:firstCard?.top||null
            };
          });
          assert(wellsMobileLayout.uniqueRows===2 && wellsMobileLayout.firstRowCount===3,'Mobile well radius controls are not a compact 3 by 2 grid');
          assert(Math.min(...wellsMobileLayout.chipWidths)>80,'Mobile well radius controls are too narrow to tap comfortably');
          assert(wellsMobileLayout.toolbarHeight<235,'Mobile Wells toolbar is still too tall');
          assert(wellsMobileLayout.firstCardTop && wellsMobileLayout.firstCardTop-wellsMobileLayout.sheetTop<360,'Well results still start too far down the mobile sheet');
          assert((await page.evaluate(()=>history.state?.r5AtlasSheet))==='wellsPanel','Opening Wells did not create an in-app Back state');

          const urlBeforeSheetBack=page.url();
          await page.goBack({timeout:10000}).catch(()=>null);
          await page.waitForFunction(()=>!document.querySelector('.content>.section.mobile-open'));
          assert(page.url()===urlBeforeSheetBack,'Android-style Back navigated away instead of closing the Wells sheet');
          assert(await page.locator('#jobInput').isVisible(),'App content disappeared after closing Wells with Back');
          assert(!await page.locator('#sheetBackdrop').evaluate(el=>el.classList.contains('show')),'Sheet backdrop remained after Back closed Wells');

          let records=await page.evaluate(()=>R5DeviceStore.getAllSavedLocations());
          assert(records.length===1,'Pack 3 created duplicate canonical LSD records');
          let record=records[0];
          assert(record.favorite===true,'Favourite state was lost');
          assert(record.tags && Array.isArray(record.tags),'Permanent LSD record does not contain tags');
          assert(record.hazards && Array.isArray(record.hazards),'Permanent LSD record does not contain hazards');
          assert(record.offlineAvailable===true,'Permanent LSD record does not report offline availability');
          assert(record.locationRecordVersion===1,'Permanent LSD record schema version is missing');
          assert(record.visitCount>=2,'PID lookup did not add a visit');
          const recordCompany=record.selectedWell?.licensee||record.licensee||savedCompany;
          const recordUwi=record.selectedWell?.uwi||record.uwi||savedUwi;
          assert(recordCompany,'Canonical record does not contain searchable company metadata');
          assert(recordUwi,'Canonical record does not contain searchable UWI metadata');

          const companyResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },recordCompany);
          assert(companyResults.some(x=>x.type==='company'),'Saved company/operator was not recognized by universal search');

          const wellResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },recordUwi);
          assert(wellResults.some(x=>x.type==='well'),'Canonical UWI was not recognized by universal search');

          const facilityName=await page.evaluate(()=>facilities[0].name);
          const facilityResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },facilityName);
          assert(facilityResults.some(x=>x.type==='facility'),'Disposal facility was not recognized by universal search');
          const searchLayerState=await page.evaluate(()=>({
            open:document.getElementById('mapSection').classList.contains('search-open'),
            filterOpacity:getComputedStyle(document.getElementById('facilityCategoryFilters')).opacity,
            filterPointerEvents:getComputedStyle(document.getElementById('facilityCategoryFilters')).pointerEvents,
            searchZ:+getComputedStyle(document.querySelector('.map-search')).zIndex,
            filterZ:+getComputedStyle(document.getElementById('facilityCategoryFilters')).zIndex
          }));
          assert(searchLayerState.open===true,'Mobile map did not enter search-open state for suggestions');
          assert(searchLayerState.filterOpacity==='0' && searchLayerState.filterPointerEvents==='none','Disposal controls were not suppressed while search suggestions were open');
          assert(searchLayerState.searchZ>searchLayerState.filterZ,'Search layer is not above the disposal filter layer');
          const disposalButton=page.locator('#universalSearchResults .search-result').filter({hasText:'Disposal'}).first();
          await disposalButton.click();
          assert((await page.locator('#jobStatus').innerText()).includes('Disposal:'),'Disposal result did not focus the map');

          await page.evaluate(()=>{
            const el=document.getElementById('jobInput');
            el.value='NE-32-048-07-W5';
            el.dispatchEvent(new Event('paste',{bubbles:true}));
          });
          await page.waitForFunction(()=>document.querySelector('#jobStatus')?.textContent?.includes('Quarter section detected'));
          const quarterResults=await page.evaluate(async()=>{
            const query=document.getElementById('jobInput').value;
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          });
          assert(quarterResults.some(x=>x.tag==='Quarter'),'Paste recognition did not classify the quarter section');

          const gpsResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },'53.18331,-114.991884');
          assert(gpsResults.some(x=>x.tag==='GPS'),'GPS was not recognized in universal search');

          const recents=await page.evaluate(()=>R5UniversalSearch.getRecent());
          assert(recents.some(x=>x.type==='legal' && x.value===pid),'PID search was not added to recent searches');
          assert(recents.some(x=>x.type==='facility'),'Disposal search was not added to recent searches');

          const st37Probe=await page.evaluate(async()=>{
            await ensureSt37();
            for(const rows of surfaceGrid.values()){
              for(const row of rows||[]){
                const licence=String(row?.[2]||'').trim();
                if(!licence)continue;
                const bores=boresByLicence.get(licence)||[];
                if(bores.length){
                  return {query:licence,company:String(row?.[3]||'').trim(),surfaceDls:String(row?.[7]||'').trim()};
                }
              }
            }
            return null;
          });
          assert(st37Probe?.query,'Could not derive a real ST37 well probe for offline regression');

          await page.locator('.mobile-nav button[data-scroll="historySection"]').click();
          await page.waitForSelector('#historySection.mobile-open');
          await page.locator('.mobile-nav button[data-scroll="mapSection"]').click();
          await page.waitForFunction(()=>!document.querySelector('.content>.section.mobile-open'));
          assert(await page.locator('.mobile-nav button[data-scroll="mapSection"]').evaluate(el=>el.classList.contains('active')),'Map did not return to the active home state');

          const mapUi=await page.evaluate(()=>R5MapUI.status());
          assert(mapUi.markerClusterAvailable===true,'Leaflet marker clustering did not load');
          assert(mapUi.facilityCount>0,'Disposal marker cluster layer is empty');
          await page.evaluate(()=>map.setView([54,-114.5],4));
          await page.waitForSelector('.r5-cluster-disposal',{timeout:10000});
          assert((await page.locator('.r5-cluster-disposal').count())>0,'Disposal facilities are not clustering at low zoom');

          await page.locator('.mobile-nav button[data-scroll="wellsPanel"]').click();
          await page.waitForSelector('#wellsPanel.mobile-open');
          await page.locator('#wellsPanel .well-radius[data-km="10"]').click();
          await page.waitForFunction(()=>R5MapUI.status().wellCount>1,null,{timeout:60000});
          await page.locator('.mobile-nav button[data-scroll="mapSection"]').click();
          await page.waitForFunction(()=>!document.querySelector('.content>.section.mobile-open'));
          await page.evaluate(()=>map.setZoom(10));
          await page.waitForSelector('.r5-cluster-well',{timeout:15000});
          assert((await page.locator('.r5-cluster-well').count())>0,'Surface wells are not clustering when markers overlap');

          const disposalMarkerTitle=await page.locator('.leaflet-marker-icon[title^="Disposal"]').first().getAttribute('title');
          assert(!!disposalMarkerTitle,'Disposal markers do not expose accessible titles');
          assert((await page.locator('#facilityCategoryFilters .filter-chip[data-cat="red"]').getAttribute('data-state-label'))==='On','Disposal filter lacks visible non-colour state');
          const firstFacilityLabel=await page.locator('.facility').first().getAttribute('aria-label');
          assert(!!firstFacilityLabel,'Disposal cards do not have meaningful accessible labels');
          const firstWellLabel=await page.locator('.well-card').first().getAttribute('aria-label');
          assert(!!firstWellLabel,'Well cards do not have meaningful accessible labels');
          const findHeight=await page.locator('#findJob').evaluate(el=>el.getBoundingClientRect().height);
          const clearMinHeight=await page.locator('#clearWellSearch').evaluate(el=>parseFloat(getComputedStyle(el).minHeight)||0);
          const gearHeight=await page.locator('#r5-settings-gear').evaluate(el=>el.getBoundingClientRect().height);
          assert(findHeight>=44 && clearMinHeight>=44 && gearHeight>=44,'Pack 4 controls are below the 44 px touch target minimum');

          await page.locator('#r5-settings-gear').click();
          await page.waitForSelector('#r5-app-modal');
          let settingsText=await page.locator('#r5-app-modal').innerText();
          assert(settingsText.includes('Field Mode'),'Field Mode is not available from phone Settings');
          await page.locator('#r5-app-modal').getByRole('button',{name:'Field Mode: On',exact:true}).click();
          await page.waitForFunction(()=>document.body.classList.contains('field-mode') && document.querySelector('#r5-app-modal'));
          assert((await page.evaluate(()=>localStorage.getItem('r5-atlas-field-mode-v1')))==='yes','Field Mode preference was not persisted');
          const fieldHeight=await page.locator('#findJob').evaluate(el=>el.getBoundingClientRect().height);
          assert(fieldHeight>findHeight,'Field Mode did not enlarge the compact mobile primary control');
          await page.locator('#r5-app-modal').getByRole('button',{name:'Close',exact:true}).click();

          const fieldPage=await context.newPage();
          await fieldPage.goto(base+'?field-persist='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
          await fieldPage.waitForFunction(()=>globalThis.R5FieldUI);
          assert(await fieldPage.locator('body').evaluate(el=>el.classList.contains('field-mode')),'Field Mode did not persist into a new app page');
          await fieldPage.close();
          await page.evaluate(()=>R5FieldUI.setFieldMode(false));
          assert((await page.evaluate(()=>localStorage.getItem('r5-atlas-field-mode-v1')))==='no','Field Mode did not persist the off state');

          await page.setViewportSize({width:1024,height:768});
          await page.waitForFunction(()=>R5FieldUI.getLayout()==='tablet-landscape');
          const tabletLayout=await page.evaluate(()=>{
            const m=document.getElementById('mapSection').getBoundingClientRect();
            const d=document.querySelector('main.content').getBoundingClientRect();
            return{layout:R5FieldUI.getLayout(),mapRight:m.right,detailsLeft:d.left,mapHeight:m.height,detailsHeight:d.height};
          });
          assert(tabletLayout.layout==='tablet-landscape','Tablet landscape mode was not detected');
          assert(tabletLayout.mapRight<=tabletLayout.detailsLeft+12,'Tablet map and details are not split into adjacent columns');
          assert(tabletLayout.mapHeight>500 && tabletLayout.detailsHeight>500,'Tablet split layout does not use the landscape viewport');

          await page.setViewportSize({width:1440,height:900});
          await page.waitForFunction(()=>R5FieldUI.getLayout()==='desktop' && document.querySelector('.page')?.classList.contains('desktop-workspace'));
          const desktopLayout=await page.evaluate(()=>{
            const left=document.querySelector('.desktop-left-rail').getBoundingClientRect();
            const mapBox=document.getElementById('mapSection').getBoundingClientRect();
            const right=document.querySelector('.desktop-right-rail').getBoundingClientRect();
            return{
              searchParent:document.querySelector('.map-search')?.parentElement?.className||'',
              savedParent:document.getElementById('historySection')?.parentElement?.className||'',
              jobParent:document.getElementById('jobSection')?.parentElement?.className||'',
              leftRight:left.right,mapLeft:mapBox.left,mapRight:mapBox.right,rightLeft:right.left
            };
          });
          assert(desktopLayout.searchParent.includes('desktop-search-slot'),'Desktop search is not in the left rail');
          assert(desktopLayout.savedParent.includes('desktop-saved-slot'),'Desktop Saved panel is not in the left rail');
          assert(desktopLayout.jobParent.includes('desktop-detail-slot'),'Desktop details are not in the right rail');
          assert(desktopLayout.leftRight<=desktopLayout.mapLeft+4 && desktopLayout.mapRight<=desktopLayout.rightLeft+4,'Desktop three-panel ordering is incorrect');

          await page.setViewportSize({width:390,height:844});
          await page.waitForFunction(()=>R5FieldUI.getLayout()==='mobile' && document.getElementById('historySection')?.parentElement?.classList.contains('content'));
          assert(await page.locator('.mobile-nav').isVisible(),'Mobile navigation did not restore after desktop layout');

          await page.waitForSelector('#r5-settings-gear',{timeout:10000});
          await page.locator('#r5-settings-gear').click();
          await page.waitForSelector('#r5-app-modal');
          settingsText=await page.locator('#r5-app-modal').innerText();
          assert(settingsText.includes('IndexedDB device database'),'Pack 2 device storage disappeared from Settings');
          assert(settingsText.includes('Field Mode'),'Field Mode disappeared from Settings');
          assert(!settingsText.includes('Coming soon'),'Placeholder settings are visible');
          await page.locator('#r5-app-modal').getByRole('button',{name:'Close',exact:true}).click();

          await page.evaluate(()=>navigator.serviceWorker.ready.then(()=>true));
          await page.waitForTimeout(2500);
          assert(pageErrors.length===0,'Online page errors: '+pageErrors.join(' | '));

          await context.setOffline(true);
          await page.reload({waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#jobInput',{state:'visible',timeout:20000});
          await page.waitForFunction(()=>globalThis.R5Pack2Ready && globalThis.R5UniversalSearch && globalThis.R5DeviceStore);
          await page.evaluate(()=>globalThis.R5Pack2Ready);

          assert(await page.locator('meta[name="r5-app-version"]').getAttribute('content')===expected,'Offline reload did not serve v'+expected);
          assert((await page.locator('#connectionStatus').innerText()).includes('OFFLINE'),'Offline status strip does not show OFFLINE');
          await page.waitForFunction(()=>document.querySelector('#dataSourceStatus')?.textContent?.includes('ST37'),null,{timeout:15000});
          assert((await page.locator('#dataSourceStatus').innerText()).includes('ST37'),'Offline data strip does not identify the cached ST37 snapshot');
          assert((await page.evaluate(()=>R5UniversalSearch.status().st37Cached))===true,'Universal-search status does not report the cached ST37 snapshot');

          const offlineEmptyResults=await page.evaluate(async()=>{
            await R5UniversalSearch.search('');
            return R5UniversalSearch.getResults();
          });
          assert(offlineEmptyResults.some(x=>x.favorite),'Favourite suggestion disappeared offline');
          assert(offlineEmptyResults.some(x=>x.tag==='Recent'),'Recent searches disappeared offline');

          await page.locator('#jobInput').fill(pid);
          await page.waitForTimeout(300);
          assert((await page.locator('#universalSearchResults').innerText()).includes('PID'),'Offline PID recognition failed');
          await page.locator('#findJob').click();
          await page.waitForFunction(()=>document.querySelector('#jobStatus')?.textContent?.includes('Job loaded:'),null,{timeout:45000});
          assert((await page.locator('#jobDetails').innerText()).includes(canonical),'Offline PID lookup did not resolve the expected LSD');

          const offlineRecord=(await page.evaluate(()=>R5DeviceStore.getAllSavedLocations()))[0];
          const offlineCompany=offlineRecord?.selectedWell?.licensee||offlineRecord?.licensee||recordCompany;
          const offlineUwi=offlineRecord?.selectedWell?.uwi||offlineRecord?.uwi||recordUwi;
          const normalizeWellId=value=>String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
          assert(normalizeWellId(offlineUwi)===normalizeWellId(recordUwi),'Offline well reload replaced the saved UWI with a different well');

          const offlineCompanyResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },offlineCompany);
          assert(offlineCompanyResults.some(x=>x.type==='company'),'Offline canonical-company search failed');

          const offlineWellResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },offlineUwi);
          assert(offlineWellResults.some(x=>x.type==='well'),'Offline canonical-UWI search failed');

          const st37Results=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },st37Probe.query);
          assert(st37Results.some(x=>x.type==='well'),'Real cached ST37 lookup did not return an offline well result');

          const offlineFacilityResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },facilityName);
          assert(offlineFacilityResults.some(x=>x.type==='facility'),'Offline disposal search failed');

          const offlineGpsResults=await page.evaluate(async query=>{
            await R5UniversalSearch.search(query);
            return R5UniversalSearch.getResults();
          },'53.18331,-114.991884');
          assert(offlineGpsResults.some(x=>x.tag==='GPS'),'Offline GPS recognition failed');
          await page.locator('#findJob').click();
