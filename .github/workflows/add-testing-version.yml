name: Add testing app version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-testing-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible version to testing header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('testing/index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="data-pill">ST37 • Aug 2026</div>'
          new = '<div class="data-pill">ST37 • Aug 2026 • App v0.1.0</div>'
          if old not in text:
              raise SystemExit('Expected testing header text not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify version and production unchanged
        shell: bash
        run: |
          grep -Fq 'ST37 • Aug 2026 • App v0.1.0' testing/index.html
          git diff --exit-code HEAD -- index.html assets

      - name: Commit testing version and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/add-testing-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/index.html .github/workflows/add-testing-version.yml
          git commit -m 'Show app version in testing header'
          git push origin HEAD:main
