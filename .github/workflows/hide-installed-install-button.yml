name: R5 Atlas v0.2.1 installed app UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-installed-install-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Hide install action when already installed and bump version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app = Path('testing/app-update.js')
          text = app.read_text(encoding='utf-8')
          old = "        { label: 'Install app', className: 'r5-primary', onClick: () => { closeModal(); installApp(); } },"
          new = "        ...(isStandalone() ? [] : [{ label: 'Install app', className: 'r5-primary', onClick: () => { closeModal(); installApp(); } }]),"
          if old not in text:
              raise SystemExit('Expected Install app action was not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('testing/index.html')
          html = index.read_text(encoding='utf-8')
          if 'App v0.2.0' not in html or 'name="r5-app-version" content="0.2.0"' not in html:
              raise SystemExit('Expected v0.2.0 markers were not found in testing index')
          html = html.replace('App v0.2.0', 'App v0.2.1', 1)
          html = html.replace('name="r5-app-version" content="0.2.0"', 'name="r5-app-version" content="0.2.1"', 1)
          index.write_text(html, encoding='utf-8')

          release_path = Path('testing/version.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          if release.get('version') != '0.2.0':
              raise SystemExit(f"Expected version 0.2.0, found {release.get('version')}")
          release['version'] = '0.2.1'
          release['releasedAt'] = '2026-09-15'
          release['title'] = 'Installed app controls cleanup'
          release['notes'] = [
              'The Install app button is now hidden when R5 Atlas is already installed.',
              'The Install app option remains available when R5 Atlas is opened in a browser and is not installed.'
          ]
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate v0.2.1
        shell: bash
        run: |
          node --check testing/app-update.js
          python -m json.tool testing/version.json >/dev/null
          grep -Fq 'App v0.2.1' testing/index.html
          grep -Fq 'name="r5-app-version" content="0.2.1"' testing/index.html
          grep -Fq "...(isStandalone() ? [] : [{ label: 'Install app'" testing/app-update.js
          git diff --exit-code HEAD -- index.html assets

      - name: Commit v0.2.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testing/app-update.js testing/index.html testing/version.json
          git commit -m 'Hide install action after installation v0.2.1'
          git push origin HEAD:main
