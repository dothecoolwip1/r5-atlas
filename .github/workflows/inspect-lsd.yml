name: Build isolated LSD test copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lsd.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact compact Alberta LSD pack
        env:
          LSD_FETCH_WORKERS: '24'
        run: |
          python .github/lsd-build/build_lsd_pack.py testing/data/alberta-ats-v41-lsd.bin
          echo '70a4f54d9df816f74828b6302bdbce9f35d74926cb31e12802e74bd620ccf3c6  testing/data/alberta-ats-v41-lsd.bin' | sha256sum -c -
          python -c "import json; d=json.load(open('testing/data/alberta-ats-v41-lsd.manifest.json')); assert d['buildStats']['records']==4026248"
          rm testing/data/alberta-ats-v41-lsd.bin

      - name: Change only the LSD lookup in the testing copy
        run: python .github/lsd-build/patch_testing.py

      - name: Verify production was not changed
        run: |
          git diff --exit-code HEAD -- index.html assets
          test -f testing/lsd-converter.js
          test -f testing/data/alberta-ats-v41-lsd.bin.gz
          test -f testing/data/alberta-ats-v41-lsd.manifest.json

      - name: Commit finished testing copy and remove temporary builder
        run: |
          rm -rf .github/lsd-build
          rm -f .github/workflows/inspect-lsd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A testing .github
          git commit -m 'Replace only LSD lookup in exact testing copy'
          git push origin HEAD:main
